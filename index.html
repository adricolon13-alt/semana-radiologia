<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1117">
    <title>X-Ray Challenge | Semana del Tecnólogo Radiológico</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0d1117;
            --panel: rgba(17, 26, 35, 0.88);
            --panel-border: rgba(0, 255, 136, 0.22);
            --neon: #00ff88;
            --neon-soft: rgba(0, 255, 136, 0.15);
            --text: #edf7f2;
            --muted: #91a59c;
            --danger: #ff667a;
            --grid: rgba(110, 170, 150, 0.065);
        }

        * { box-sizing: border-box; }

        html { min-height: 100%; background: var(--bg); }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            background:
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px),
                radial-gradient(ellipse at 50% 35%, #12251f 0%, var(--bg) 63%);
            background-size: 34px 34px, 34px 34px, auto;
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button, input { font: inherit; }
        button { cursor: pointer; }
        button:focus-visible, input:focus-visible { outline: 2px solid #8bffc5; outline-offset: 4px; }
        .screen { position: relative; min-height: 100svh; width: 100%; isolation: isolate; }
        .hidden { display: none !important; }

        .particles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; }
        .bone {
            position: absolute;
            width: 62px;
            height: 18px;
            opacity: .55;
            border-radius: 12px;
            background: linear-gradient(90deg, rgba(224, 255, 240, .22), rgba(0, 255, 136, .16));
            box-shadow: 0 0 18px rgba(0, 255, 136, .06);
            animation: drift 16s linear infinite;
        }
        .bone::before, .bone::after {
            content: "";
            position: absolute;
            width: 17px;
            height: 17px;
            top: 0;
            border: 3px solid rgba(194, 255, 222, .34);
            border-radius: 50%;
            background: #0d1715;
        }
        .bone::before { left: -4px; }
        .bone::after { right: -4px; }
        .bone:nth-child(1) { left: 8%; top: 18%; transform: rotate(32deg); animation-duration: 22s; }
        .bone:nth-child(2) { left: 76%; top: 20%; transform: rotate(-27deg); animation-duration: 18s; animation-delay: -7s; }
        .bone:nth-child(3) { left: 17%; top: 74%; transform: rotate(-43deg); animation-duration: 25s; animation-delay: -13s; }
        .bone:nth-child(4) { left: 82%; top: 70%; transform: rotate(62deg); animation-duration: 20s; animation-delay: -4s; }
        .bone:nth-child(5) { left: 47%; top: 8%; transform: rotate(75deg); animation-duration: 28s; animation-delay: -18s; }
        .bone:nth-child(6) { left: 60%; top: 88%; transform: rotate(-12deg); animation-duration: 23s; animation-delay: -10s; }
        @keyframes drift {
            0% { translate: 0 12vh; rotate: 0deg; opacity: .25; }
            50% { translate: 28px -10vh; rotate: 95deg; opacity: .72; }
            100% { translate: -18px -115vh; rotate: 190deg; opacity: .3; }
        }

        .welcome {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 18px;
        }
        .welcome-card { width: min(100%, 680px); text-align: center; }
        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--panel-border);
            border-radius: 999px;
            padding: 8px 13px;
            color: #a8ffd0;
            background: rgba(0, 255, 136, .055);
            font-size: .73rem;
            font-weight: 800;
            letter-spacing: .13em;
            text-transform: uppercase;
        }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 12px var(--neon); }
        .logo-wrap { width: 160px; height: 160px; margin: 22px auto 16px; display: grid; place-items: center; }
        .radiology-logo { width: 100%; height: 100%; filter: drop-shadow(0 0 9px rgba(0,255,136,.7)); animation: glowPulse 2.6s ease-in-out infinite; }
        @keyframes glowPulse {
            0%, 100% { filter: drop-shadow(0 0 7px rgba(0,255,136,.55)); transform: scale(.98); }
            50% { filter: drop-shadow(0 0 22px rgba(0,255,136,.95)); transform: scale(1.03); }
        }
        h1 { margin: 0 auto; max-width: 620px; font-size: clamp(2rem, 7vw, 3.8rem); line-height: 1.06; letter-spacing: -.055em; }
        h1 span { color: var(--neon); text-shadow: 0 0 22px rgba(0,255,136,.2); }
        .intro { max-width: 490px; margin: 16px auto 24px; color: var(--muted); line-height: 1.65; font-size: .98rem; }
        .setup-panel { margin: 0 auto; max-width: 460px; padding: 20px; border: 1px solid var(--panel-border); border-radius: 22px; background: var(--panel); box-shadow: 0 18px 70px rgba(0,0,0,.28); text-align: left; }
        label { display: block; margin-bottom: 9px; color: #d9eee4; font-size: .86rem; font-weight: 700; }
        .name-input { width: 100%; min-height: 52px; padding: 0 15px; border: 1px solid #30463d; border-radius: 12px; background: #0b1210; color: var(--text); outline: none; }
        .name-input:focus { border-color: var(--neon); box-shadow: 0 0 0 3px rgba(0,255,136,.09); }
        .primary-btn { display: flex; width: 100%; min-height: 56px; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; padding: 14px 18px; border: 0; border-radius: 13px; background: var(--neon); color: #062116; font-weight: 900; box-shadow: 0 0 24px rgba(0,255,136,.18); transition: transform .2s, box-shadow .2s, background .2s; }
        .primary-btn:hover { transform: translateY(-2px); background: #5dffb1; box-shadow: 0 0 34px rgba(0,255,136,.35); }
        .primary-btn:active { transform: translateY(0); }
        .fine-print { margin: 13px 2px 0; color: #71877c; font-size: .72rem; line-height: 1.5; text-align: center; }

        .game-screen { padding: 18px 14px 30px; }
        .game-shell { width: min(100%, 950px); margin: 0 auto; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 3px 0 16px; border-bottom: 1px solid rgba(145,165,156,.17); }
        .brand-mini { display: flex; align-items: center; gap: 10px; font-size: .8rem; font-weight: 850; letter-spacing: .08em; }
        .brand-mini svg { width: 29px; height: 29px; }
        .player-pill { max-width: 55%; overflow: hidden; padding: 8px 11px; border: 1px solid #2a4137; border-radius: 999px; color: #b6d6c6; font-size: .76rem; text-overflow: ellipsis; white-space: nowrap; }
        .level-heading { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; padding: 23px 0 17px; }
        .level-tag { color: var(--neon); font-size: .72rem; font-weight: 900; letter-spacing: .16em; }
        h2 { margin: 5px 0 0; font-size: clamp(1.55rem, 5vw, 2.4rem); letter-spacing: -.045em; }
        .score-box { padding: 9px 12px; border: 1px solid var(--panel-border); border-radius: 12px; background: rgba(0,255,136,.045); text-align: right; }
        .score-box small { display: block; color: var(--muted); font-size: .67rem; text-transform: uppercase; letter-spacing: .08em; }
        .score-box strong { color: var(--neon); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
        .game-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
        .panel { border: 1px solid var(--panel-border); border-radius: 20px; background: var(--panel); box-shadow: 0 16px 45px rgba(0,0,0,.18); }
        .scanner-panel { min-height: 390px; padding: 18px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .scanner-caption { align-self: stretch; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 6px 18px; color: var(--muted); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; }
        .live-label { display: inline-flex; align-items: center; gap: 6px; color: var(--neon); }
        .scanner-circle { position: relative; width: min(65vw, 300px); aspect-ratio: 1; border: 2px solid rgba(0,255,136,.9); border-radius: 50%; overflow: hidden; background: radial-gradient(circle, rgba(0,255,136,.075), rgba(0,0,0,.1) 68%); box-shadow: 0 0 18px rgba(0,255,136,.12), inset 0 0 25px rgba(0,255,136,.08); }
        .scanner-circle::before, .scanner-circle::after { content: ""; position: absolute; background: rgba(0,255,136,.2); }
        .scanner-circle::before { width: 1px; height: 100%; left: 50%; top: 0; }
        .scanner-circle::after { height: 1px; width: 100%; top: 50%; left: 0; }
        .scan-ring { position: absolute; inset: 13%; border: 1px dashed rgba(0,255,136,.45); border-radius: 50%; }
        .scan-ring.ring-two { inset: 27%; border-style: solid; opacity: .6; }
        .scan-line { position: absolute; z-index: 2; left: 0; right: 0; top: -5%; height: 3px; background: #a0ffcf; box-shadow: 0 0 9px 3px rgba(0,255,136,.6); animation: scanDown 3s linear infinite; }
        @keyframes scanDown { from { top: -3%; } to { top: 103%; } }
        .bag-art { position: absolute; z-index: 1; width: 48%; height: 56%; top: 24%; left: 26%; filter: drop-shadow(0 0 10px rgba(0,255,136,.25)); }
        .scanner-label { margin-top: 14px; color: #9eb9aa; font-size: .72rem; text-align: center; }
        .controls-panel { padding: 18px; }
        .controls-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
        .controls-head h3 { margin: 0; font-size: 1rem; }
        .controls-head p { margin: 5px 0 0; color: var(--muted); font-size: .76rem; line-height: 1.5; }
        .timer { min-width: 68px; padding: 8px 10px; border: 1px solid #30463d; border-radius: 12px; text-align: center; }
        .timer span { display: block; color: var(--muted); font-size: .62rem; text-transform: uppercase; }
        .timer strong { color: var(--neon); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
        .timer.urgent { border-color: var(--danger); animation: urgentPulse .5s ease-in-out infinite alternate; }
        .timer.urgent strong { color: var(--danger); }
        @keyframes urgentPulse { to { box-shadow: 0 0 13px rgba(255,102,122,.2); } }
